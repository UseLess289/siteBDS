<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMES | AFRIQU'EIRB</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Noto+Sans+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="primes.css">
    <script type="module">
        import protect from "/lib/protect.js";
        protect.getData()
            .then(data => {
                window._currentUser = data.user.uid;
                window._currentName = data.user.prenom || data.user.uid;
                document.dispatchEvent(new Event('user-ready'));
            })
            .catch(() => protect.login());
    </script>
</head>

<body>
    <nav id="primes-nav">
        <a href="index.html" id="back-btn"><img src="assets/back.png" alt="Retour"></a>
        <a href="index.html" class="nav-logo">AFRIQU'EIRB</a>
        <div id="player-score">
            <span id="player-name">—</span>
            <span id="player-prime">0 M</span>
            <span class="berries-label">berries</span>
        </div>
    </nav>
    <main>
        <section id="top3-section">
            <h2 class="section-title">Classement</h2>
            <div id="top3-podium">
                <div class="podium-slot" id="podium-2">
                    <div class="podium-rank">#2</div>
                    <div class="podium-name">—</div>
                    <div class="podium-prime">—</div>
                    <div class="podium-bar" style="height:80px"></div>
                </div>
                <div class="podium-slot" id="podium-1">
                    <div class="podium-rank">#1</div>
                    <div class="podium-crown"></div>
                    <div class="podium-name">—</div>
                    <div class="podium-prime">—</div>
                    <div class="podium-bar" style="height:120px"></div>
                </div>
                <div class="podium-slot" id="podium-3">
                    <div class="podium-rank">#3</div>
                    <div class="podium-name">—</div>
                    <div class="podium-prime">—</div>
                    <div class="podium-bar" style="height:55px"></div>
                </div>
            </div>
        </section>
        <section id="membres-section">
            <h2 class="section-title">Défis à réaliser : clique sur un membre pour voir le défi</h2>
            <div id="membres-grid"></div>
        </section>
    </main>
    <div id="validation-modal">
        <div class="val-modal-bg"></div>
        <div class="val-modal-box">
            <h2 id="val-titre">Valider le défi</h2>
            <p id="val-defi">—</p>
            <p id="val-gain">+ — M berries</p>
            <button id="val-demander">Demander les points</button>
            <p id="val-msg"></p>
        </div>
    </div>
    <script src="primes.js"></script>
</body>

</html>
